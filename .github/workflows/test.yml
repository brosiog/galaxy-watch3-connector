name: Connector host tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: CC=clang sh adapter/run_adapter_tests.sh
      - run: python3 startup/test_startup.py
      - run: python3 startup/test_runtime_sessions.py
